[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "cubevis"
authors = [{name = "Malte Ihlefeld"}]
license = {file = "LICENSE"}
classifiers = ["License :: OSI Approved :: MIT License"]
dynamic = ["version", "description"]
dependencies = [
    "pandas",
    "scipy",
    "typer",
    "rich",
    "jinja2",
    "odfpy",
    "polars>=2.1.0",
    "isort>=9.0.2",
    "openpyxl>=3.1.5",
]
[project.scripts]
allg-gen = "cubevis.cli:app"
